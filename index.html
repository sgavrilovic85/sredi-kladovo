<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sredi Kladovo</title>
    <style>
        :root {
            --primary: #0056b3;
            --secondary: #28a745;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--primary);
            color: white;
            text-align: center;
            padding: 1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
        }

        .nav-tabs {
            display: flex;
            justify-content: space-around;
            background: white;
            border-radius: 10px;
            padding: 5px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            border-radius: 8px;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .points-badge {
            background: #ffc107;
            color: #000;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }

        form label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        form input, form textarea, form select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button.btn-submit {
            width: 100%;
            background: var(--secondary);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 15px;
            cursor: pointer;
        }

        .reward-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .reward-item:last-child { border-bottom: none; }

        .reward-points {
            background: var(--primary);
            color: white;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
        }

        .btn-claim {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-claim:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .sponsor-form-toggle {
            background: #6c757d;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            width: 100%;
            margin-top: 15px;
            cursor: pointer;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <header>
        <h1>Sredi Kladovo 🏙️</h1>
    </header>

    <div class="container">
        <!-- Navigacija -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="showTab('prijava')">📸 Prijava</button>
            <button class="tab-btn" onclick="showTab('nagrade')">🎁 Nagrade</button>
        </div>

        <!-- Stanje bodova -->
        <div class="card" style="text-align: center;">
            <div>Moji bodovi:</div>
            <div class="points-badge">🏆 <span id="user-points">0</span> poena</div>
        </div>

        <!-- TAB 1: Prijava problema -->
        <div id="tab-prijava" class="tab-content">
            <div class="card">
                <h3>Prijavi komunalni problem</h3>
                <form id="issue-form" onsubmit="submitReport(event)">
                    <label>Kategorija:</label>
                    <select id="category" required>
                        <option value="Divlja deponija / Šut">Divlja deponija / Šut</option>
                        <option value="Rupa na putu">Oštećenje kolovoza / Rupa</option>
                        <option value="Javna rasveta">Neispravna javna rasveta</option>
                        <option value="Ostalo">Ostalo</option>
                    </select>

                    <label>Opis i detalji:</label>
                    <textarea id="description" rows="3" placeholder="Opišite problem..." required></textarea>

                    <label>Slika problema:</label>
                    <input type="file" id="image" accept="image/*" capture="environment">

                    <button type="submit" class="btn-submit">Pošalji prijavu</button>
                </form>
            </div>
        </div>

        <!-- TAB 2: Nagrade i sponzori -->
        <div id="tab-nagrade" class="tab-content hidden">
            <div class="card">
                <h3>Sponzori i Popusti</h3>
                <p style="font-size: 14px; color: #666;">Zamenite sačuvane bodove za popuste kod lokalnih partnera!</p>
                <div id="rewards-list">
                    <!-- Dinamički prikaz nagrada -->
                </div>

                <!-- Unos sponzora uživo -->
                <button class="sponsor-form-toggle" onclick="toggleSponsorForm()">+ Unesi novog sponzora (Administracija)</button>
                <div id="sponsor-form-container" class="card hidden" style="margin-top: 15px; border: 1px solid #ddd;">
                    <h4>Brzi unos sponzora</h4>
                    <form onsubmit="addSponsor(event)">
                        <input type="text" id="sp-name" placeholder="Naziv partnera / radnje" required>
                        <input type="text" id="sp-title" placeholder="Opis popusta (npr. 10% na alat)" required>
                        <input type="number" id="sp-cost" min="1" max="20" placeholder="Cena u bodovima (1-20)" required>
                        <button type="submit" class="btn-submit" style="background: var(--primary);">Sačuvaj sponzora</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const RECIPIENT_EMAIL = "sredikladovo@gmail.com";
        const DUPLICATE_RADIUS_KM = 0.03; // Oko 30 metara radijus za duplikate

        // Inicijalizacija podataka iz LocalStorage
        let userPoints = parseInt(localStorage.getItem('sk_points')) || 0;
        let reportsHistory = JSON.parse(localStorage.getItem('sk_reports')) || [];
        let rewards = JSON.parse(localStorage.getItem('sk_rewards')) || [
            { id: 1, partner: "Stovarište & Farbara", desc: "10% popusta na farbe i alat", cost: 5 },
            { id: 2, partner: "Auto-Perionica Blic", desc: "Besplatno kompletno pranje", cost: 12 }
        ];

        document.getElementById('user-points').innerText = userPoints;

        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.remove('hidden');
            event.currentTarget.classList.add('active');
            if(tabName === 'nagrade') renderRewards();
        }

        function toggleSponsorForm() {
            document.getElementById('sponsor-form-container').classList.toggle('hidden');
        }

        // Kalkulacija udaljenosti (Haversine formula za GPS)
        function getDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function submitReport(e) {
            e.preventDefault();
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    processReport(position.coords.latitude, position.coords.longitude);
                }, () => {
                    processReport(null, null); // Bez lokacije
                });
            } else {
                processReport(null, null);
            }
        }

        function processReport(lat, lng) {
            const cat = document.getElementById('category').value;
            const desc = document.getElementById('description').value;

            // Provera da li je duplikat u radijusu od ~30m
            let isDuplicate = false;
            if (lat && lng) {
                isDuplicate = reportsHistory.some(rep => {
                    if (!rep.lat || !rep.lng) return false;
                    return getDistanceKm(lat, lng, rep.lat, rep.lng) < DUPLICATE_RADIUS_KM;
                });
            }

            // Slanje imejla
            const subject = encodeURIComponent(`[Sredi Kladovo] Nova prijava: ${cat}`);
            const body = encodeURIComponent(`Kategorija: ${cat}\nOpis: ${desc}\nLokacija: ${lat ? `${lat},${lng}` : "Nepoznata"}\nDuplikat na lokaciji: ${isDuplicate ? "DA" : "NE"}`);
            
            window.location.href = `mailto:${RECIPIENT_EMAIL}?subject=${subject}&body=${body}`;

            // Beleženje u istoriju
            reportsHistory.push({ lat, lng, time: new Date().getTime() });
            localStorage.setItem('sk_reports', JSON.stringify(reportsHistory));

            // Dodeljivanje bodova samo ako nije duplikat
            if (!isDuplicate) {
                userPoints += 1;
                localStorage.setItem('sk_points', userPoints);
                document.getElementById('user-points').innerText = userPoints;
                alert("Uspešno poslato! Dobili ste 1 bod za prijavu.");
            } else {
                alert("Prijava je poslata inspekciji! Na ovoj lokaciji je problem već prijavljen, pa nisu dodeljeni dodatni bodovi.");
            }

            document.getElementById('issue-form').reset();
        }

        function renderRewards() {
            const list = document.getElementById('rewards-list');
            list.innerHTML = '';
            
            rewards.forEach(rew => {
                const canClaim = userPoints >= rew.cost;
                list.innerHTML += `
                    <div class="reward-item">
                        <div>
                            <strong>${rew.partner}</strong><br>
                            <span style="font-size: 13px; color: #555;">${rew.desc}</span>
                        </div>
                        <div style="text-align: right;">
                            <span class="reward-points">${rew.cost} bodova</span><br><br>
                            <button class="btn-claim" ${canClaim ? '' : 'disabled'} onclick="claimReward('${rew.partner}', ${rew.cost})">
                                ${canClaim ? 'Preuzmi' : 'Nedovoljno bodova'}
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function addSponsor(e) {
            e.preventDefault();
            const partner = document.getElementById('sp-name').value;
            const desc = document.getElementById('sp-title').value;
            const cost = parseInt(document.getElementById('sp-cost').value);

            rewards.push({ id: Date.now(), partner, desc, cost });
            localStorage.setItem('sk_rewards', JSON.stringify(rewards));
            
            alert(`Sponzor "${partner}" uspešno unet!`);
            document.getElementById('sp-name').value = '';
            document.getElementById('sp-title').value = '';
            document.getElementById('sp-cost').value = '';
            
            toggleSponsorForm();
            renderRewards();
        }

        function claimReward(partner, cost) {
            if (userPoints >= cost) {
                userPoints -= cost;
                localStorage.setItem('sk_points', userPoints);
                document.getElementById('user-points').innerText = userPoints;
                alert(`Uspešno ste iskoristili kupon kod partnera: ${partner}! Pokažite ovaj ekran radniku.`);
                renderRewards();
            }
        }
    </script>
</body>
</html>
