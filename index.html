<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sredi Kladovo</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        /* Kategorije u obliku kartica/dugmadi */
        .categories-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .category-btn {
            background: #f1f5f9;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .category-btn:hover {
            border-color: var(--primary);
            background: #eff6ff;
        }

        .category-btn.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            resize: vertical;
            min-height: 90px;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        /* Mapa */
        #map {
            width: 100%;
            height: 220px;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            margin-top: 8px;
            z-index: 1;
        }

        .map-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Fajl upload stil */
        .file-upload-wrapper {
            position: relative;
            border: 2px dashed var(--border-color);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            background: #f8fafc;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .file-upload-wrapper:hover {
            border-color: var(--primary);
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-upload-text {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Submit dugme */
        button[type="submit"] {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background: var(--primary-dark);
        }

        #status-message {
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sredi Kladovo</h1>
        <p class="subtitle">Prijavite komunalni problem u našem gradu</p>

        <form id="reportForm" action="https://formspree.io/f/meaebzzq" method="POST" enctype="multipart/form-data">
            
            <!-- Sakriveno polje za kategoriju -->
            <input type="hidden" id="category" name="kategorija" required>

            <!-- Kategorije -->
            <div class="form-group">
                <label>Kategorija problema *</label>
                <div class="categories-grid">
                    <div class="category-btn" data-value="Rupa na putu">🕳️ Rupa na putu</div>
                    <div class="category-btn" data-value="Neispravna rasvjeta">💡 Rasvjeta</div>
                    <div class="category-btn" data-value="Divlja deponija">🗑️ Deponija</div>
                    <div class="category-btn" data-value="Ostalo">⚠️ Ostalo</div>
                </div>
            </div>

            <!-- Opis (opciono) -->
            <div class="form-group">
                <label for="description">Opis (opciono)</label>
                <textarea id="description" name="opis" placeholder="Unesite dodatne detalje o lokaciji ili problemu..."></textarea>
            </div>

            <!-- Slika -->
            <div class="form-group">
                <label>Fotografija (opciono)</label>
                <div class="file-upload-wrapper">
                    <span class="file-upload-text" id="file-label">📷 Izaberite ili uslikajte fotografiju</span>
                    <input type="file" id="image" name="slika" accept="image/*">
                </div>
            </div>

            <!-- Lokacija (Mapa) -->
            <div class="form-group">
                <label>Lokacija na mapi</label>
                <div id="map"></div>
                <div class="map-hint">Možete pomeriti marker na tačnu lokaciju problema.</div>
                <input type="hidden" id="lat" name="latitude">
                <input type="hidden" id="lng" name="longitude">
            </div>

            <button type="submit">Pošalji prijavu</button>
            <div id="status-message"></div>
        </form>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicijalizacija mape centrirane na Kladovo (44.6089, 22.6170)
        const kladovoCoords = [44.6089, 22.6170];
        const map = L.map('map').setView(kladovoCoords, 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const marker = L.marker(kladovoCoords, { draggable: true }).addTo(map);

        // Ažuriranje skrivenih polja za koordinate
        function updateCoords(lat, lng) {
            document.getElementById('lat').value = lat;
            document.getElementById('lng').value = lng;
        }
        updateCoords(kladovoCoords[0], kladovoCoords[1]);

        marker.on('dragend', function(event) {
            const position = marker.getLatLng();
            updateCoords(position.lat, position.lng);
        });

        // Pokušaj preuzimanja GPS lokacije uređaja ukoliko je dostupna
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const userLatLng = [position.coords.latitude, position.coords.longitude];
                marker.setLatLng(userLatLng);
                map.setView(userLatLng, 16);
                updateCoords(position.coords.latitude, position.coords.longitude);
            }, function(error) {
                console.log("GPS nije dostupan, koristi se centar Kladova.");
            });
        }

        // Izbor kategorija
        const categoryBtns = document.querySelectorAll('.category-btn');
        const categoryInput = document.getElementById('category');

        categoryBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                categoryBtns.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                categoryInput.value = btn.getAttribute('data-value');
            });
        });

        // Prikaz imena izabranog fajla
        const fileInput = document.getElementById('image');
        const fileLabel = document.getElementById('file-label');
        fileInput.addEventListener('change', function() {
            if (fileInput.files.length > 0) {
                fileLabel.textContent = "📎 Izabrano: " + fileInput.files[0].name;
            }
        });

        // Slanje forme preko AJAX-a da se izbegne redirekcija
        const form = document.getElementById('reportForm');
        const statusMessage = document.getElementById('status-message');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            if(!categoryInput.value) {
                alert('Molimo izaberite kategoriju problema.');
                return;
            }

            statusMessage.style.color = '#2563eb';
            statusMessage.textContent = 'Slanje prijave u toku...';

            const formData = new FormData(form);

            fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            }).then(response => {
                if (response.ok) {
                    statusMessage.style.color = '#16a34a';
                    statusMessage.textContent = 'Uspešno poslato! Hvala vam što uređujete Kladovo.';
                    form.reset();
                    categoryBtns.forEach(b => b.classList.remove('selected'));
                    fileLabel.textContent = '📷 Izaberite ili uslikajte fotografiju';
                    marker.setLatLng(kladovoCoords);
                    map.setView(kladovoCoords, 15);
                    updateCoords(kladovoCoords[0], kladovoCoords[1]);
                } else {
                    response.json().then(data => {
                        if (Object.hasOwn(data, 'errors')) {
                            statusMessage.style.color = '#dc2626';
                            statusMessage.textContent = data.errors.map(error => error.message).join(", ");
                        } else {
                            statusMessage.style.color = '#dc2626';
                            statusMessage.textContent = 'Došlo je do greške pri slanju.';
                        }
                    });
                }
            }).catch(error => {
                statusMessage.style.color = '#dc2626';
                statusMessage.textContent = 'Došlo je do greške u mreži.';
            });
        });
    </script>
</body>
</html>
