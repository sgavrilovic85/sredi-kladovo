<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sredi Kladovo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mut:#667085;--pri:#1d6fe0;--bd:#e3e7ec}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:560px;margin:auto;padding:14px}
h1{font-size:22px;margin:4px 0 2px}.sub{color:var(--mut);font-size:14px;margin-bottom:12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font-size:15px;font-weight:600}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);font-size:16px;font-family:inherit;color:var(--tx)}
.cam{position:relative;background:#000;border-radius:12px;overflow:hidden;height:300px;display:flex;align-items:center;justify-content:center}
.cam video,.cam img{width:100%;height:100%;object-fit:cover}
.shutter{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.35)}
.camtxt{color:#fff;text-align:center;padding:16px}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-size:17px;font-weight:700;margin-top:14px}
.btn.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd);font-size:14px;padding:10px;margin-top:8px}
.btn:disabled{opacity:.5}
.loc{font-size:13px;margin-top:10px}.ok{color:#1f9d55}.bad{color:#d93025}
#map{height:62vh;border-radius:14px;border:1px solid var(--bd)}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;color:#fff}
.s0{background:#e08a1d}.s1{background:#1d6fe0}.s2{background:#1f9d55}
.pop img{width:200px;border-radius:8px;margin-top:6px}
.msg{padding:12px;border-radius:10px;background:#1f9d5522;color:#1f9d55;font-weight:600;margin-top:12px}
</style>
</head>
<body>
<h1>Sredi Kladovo</h1>
<div class="sub">Slikaj problem, pošalji lokaciju, prati status.</div>
<div class="tabs"><button id="t1" class="on">Prijavi problem</button><button id="t2">Mapa prijava</button></div>

<div id="v1">
 <div class="card">
  <div class="cam" id="cam"><div class="camtxt">Kamera se pokreće...</div></div>
  <button class="btn sec" id="retake" hidden>Slikaj ponovo</button>
  <input type="file" id="file" accept="image/*" capture="environment" hidden>
  <label>Kategorija</label>
  <select id="cat">
   <option>Rupa na putu</option><option>Srušeno drvo / granje</option><option>Divlja deponija</option>
   <option>Pokvarena rasveta</option><option>Komunalni kvar (voda, kanalizacija)</option><option>Ostalo</option>
  </select>
  <label>Kratak opis</label>
  <textarea id="desc" rows="2" placeholder="Opiši problem..."></textarea>
  <div class="loc" id="loc">📍 Lokacija se uzima...</div>
  <button class="btn sec" id="relocate" hidden>Pokušaj lokaciju ponovo</button>
  <button class="btn" id="send" disabled>Pošalji prijavu</button>
  <div id="res"></div>
 </div>
</div>

<div id="v2" hidden><div id="map"></div><div class="sub" id="cnt" style="margin-top:8px"></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ===== PODEŠAVANJE (popuni posle Supabase koraka; dok je prazno radi test režim na ovom telefonu) ===== */
const SUPABASE_URL="";      // npr. https://abcdxyz.supabase.co
const SUPABASE_KEY="";      // "anon public" ključ
/* ============================================================================================ */
const CENTER=[44.0806,22.6122]; // Kladovo
const ST=["Primljeno","U radu","Rešeno"],COL=["#e08a1d","#1d6fe0","#1f9d55"];
const $=id=>document.getElementById(id);
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cloud=!!(SUPABASE_URL&&SUPABASE_KEY);
let photo=null,pos=null,stream=null,map=null,layer=null;

function show(n){$("v1").hidden=n!==1;$("v2").hidden=n!==2;
 $("t1").classList.toggle("on",n===1);$("t2").classList.toggle("on",n===2);
 if(n===2)loadMap();else if(!photo)startCam()}
$("t1").onclick=()=>show(1);$("t2").onclick=()=>show(2);

/* KAMERA */
async function startCam(){
 const c=$("cam");
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
  c.innerHTML='<video autoplay playsinline muted></video><button class="shutter" id="shot" aria-label="Slikaj"></button>';
  c.firstChild.srcObject=stream;$("shot").onclick=snap;
 }catch(e){
  c.innerHTML='<div class="camtxt">Kamera nije dozvoljena.<br><br><button class="btn" id="fb">Otvori kameru telefona</button></div>';
  $("fb").onclick=()=>$("file").click();
 }
}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function setPhoto(src){
 const im=new Image();im.onload=()=>{
  const k=Math.min(1,1000/Math.max(im.width,im.height)),cv=document.createElement("canvas");
  cv.width=im.width*k;cv.height=im.height*k;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
  cv.toBlob(b=>{photo=b;$("cam").innerHTML='<img src="'+URL.createObjectURL(b)+'" alt="">';
   $("retake").hidden=false;stopCam();upd()},"image/jpeg",.72)};
 im.src=src;
}
function snap(){const v=$("cam").firstChild,cv=document.createElement("canvas");
 cv.width=v.videoWidth;cv.height=v.videoHeight;cv.getContext("2d").drawImage(v,0,0);setPhoto(cv.toDataURL("image/jpeg",.9))}
$("file").onchange=e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>setPhoto(r.result);r.readAsDataURL(f)}};
$("retake").onclick=()=>{photo=null;$("retake").hidden=true;upd();startCam()};

/* LOKACIJA */
function getLoc(){
 $("loc").className="loc";$("loc").textContent="📍 Lokacija se uzima...";$("relocate").hidden=true;
 if(!navigator.geolocation){locFail();return}
 navigator.geolocation.getCurrentPosition(p=>{pos={lat:p.coords.latitude,lng:p.coords.longitude};
  $("loc").className="loc ok";$("loc").textContent="📍 Lokacija uzeta (tačnost ~"+Math.round(p.coords.accuracy)+" m)";upd()},
  locFail,{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
function locFail(){$("loc").className="loc bad";$("loc").textContent="📍 Lokacija je obavezna. Dozvoli lokaciju u pretraživaču.";$("relocate").hidden=false}
$("relocate").onclick=getLoc;
function upd(){$("send").disabled=!(photo&&pos)}

/* SLANJE */
async function sb(path,opt){const r=await fetch(SUPABASE_URL+path,{...opt,headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,...(opt.headers||{})}});
 if(!r.ok)throw new Error(await r.text());return r}
const blobToData=b=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(b)});

$("send").onclick=async()=>{
 $("send").disabled=true;$("res").innerHTML="";
 const rep={category:$("cat").value,description:$("desc").value.trim(),lat:pos.lat,lng:pos.lng,status:0};
 try{
  if(cloud){
   const name=Date.now()+"-"+Math.random().toString(36).slice(2,8)+".jpg";
   await sb("/storage/v1/object/photos/"+name,{method:"POST",headers:{"Content-Type":"image/jpeg"},body:photo});
   rep.photo_url=SUPABASE_URL+"/storage/v1/object/public/photos/"+name;
   await sb("/rest/v1/reports",{method:"POST",headers:{"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(rep)});
  }else{
   rep.photo_url=await blobToData(photo);rep.created_at=new Date().toISOString();
   const a=JSON.parse(localStorage.getItem("sk")||"[]");a.push(rep);localStorage.setItem("sk",JSON.stringify(a));
  }
  $("res").innerHTML='<div class="msg">✅ Prijava je poslata. Hvala!</div>';
  photo=null;$("desc").value="";$("retake").hidden=true;startCam();
 }catch(e){$("res").innerHTML='<div class="msg" style="background:#d9302522;color:#d93025">Slanje nije uspelo. Pokušaj ponovo.</div>';console.error(e)}
 upd();
};

/* MAPA */
async function loadMap(){
 if(!map){map=L.map("map").setView(CENTER,14);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
  layer=L.layerGroup().addTo(map)}
 setTimeout(()=>map.invalidateSize(),50);
 let items=[];
 try{items=cloud?await (await sb("/rest/v1/reports?select=*&order=created_at.desc&limit=200",{})).json()
  :JSON.parse(localStorage.getItem("sk")||"[]")}catch(e){}
 layer.clearLayers();
 items.forEach(r=>{
  const ic=L.divIcon({className:"",html:'<div style="width:22px;height:22px;border-radius:50%;background:'+COL[r.status||0]+';border:3px solid #fff;box-shadow:0 1px 4px #0006"></div>',iconSize:[22,22]});
  L.marker([r.lat,r.lng],{icon:ic}).addTo(layer).bindPopup('<div class="pop"><b>'+esc(r.category)+'</b> <span class="tag s'+(r.status||0)+'">'+ST[r.status||0]+'</span><br>'+esc(r.description)+
   '<br><small>'+new Date(r.created_at).toLocaleDateString("sr-RS")+'</small>'+(r.photo_url?'<br><img src="'+esc(r.photo_url)+'" alt="">':'')+'</div>')});
 $("cnt").textContent=items.length+" prijava"+(cloud?"":" (test režim, vidiš samo svoje)");
 if(items.length)map.fitBounds(L.latLngBounds(items.map(r=>[r.lat,r.lng])).pad(.3),{maxZoom:17});
}

getLoc();startCam();
</script>
</body>
</html>
